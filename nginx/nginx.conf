worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # ── Rate limiting ─────────────────────────────────────────────────────────
    # 200 r/s per source IP; burst of 500 queued without error.
    # Protects FastAPI workers from I/O starvation by slow or abusive clients.
    limit_req_zone $binary_remote_addr zone=global:20m rate=200r/s;

    # ── Upstream cluster ──────────────────────────────────────────────────────
    # Add additional FastAPI replicas here when scaling horizontally.
    # keepalive reuses connections to the ASGI workers — critical at high QPS.
    upstream fastapi {
        server fastapi:8000;
        keepalive 64;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    # Port 80 accepts connections only to issue a permanent redirect.
    # No application traffic ever travels in plaintext.
    server {
        listen 80;
        server_name _;
        server_tokens off;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS termination ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # Suppress Nginx version exposure in error responses.
        server_tokens off;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # TLSv1.0 and TLSv1.1 are deprecated by RFC 8996 and prohibited
        # by PCI-DSS 3.2+. Accept TLSv1.2 and TLSv1.3 only.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        limit_req zone=global burst=500 nodelay;

        location / {
            proxy_pass         http://fastapi;
            proxy_http_version 1.1;

            # Required for keepalive upstream connections.
            proxy_set_header   Connection        "";

            # Pass real client metadata so TelemetryLogger records the
            # originating IP rather than Nginx's container address.
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Conservative timeouts — redirect responses are sub-millisecond;
            # anything longer is a sign of a stuck worker.
            proxy_connect_timeout  5s;
            proxy_send_timeout    10s;
            proxy_read_timeout    10s;
        }
    }
}
